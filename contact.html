        <form id="contact-form" novalidate>

          <label for="message">Message:</label>
          <textarea id="message" name="message" aria-required="true"></textarea>
          <div class="error-msg" id="message-error"></div>

          <button type="submit" class="sign-in-btn">Send</button>
        </form>

        <p id="form-status" role="alert" aria-live="polite"></p>
      </section>
